[project]
name = "speakercast"
version = "2.0.0"
description = "A podcast feed for every General Conference speaker."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Philip Lundrigan" }]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13",
    "feedgen>=1.0",
    "pillow>=11.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
speakercast = "speakercast:main"

[project.urls]
Homepage = "https://philip.lundrigan.org/Speakercast/"
Source = "https://github.com/philipbl/Speakercast"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["speakercast.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network'"
markers = ["network: hits the live study API"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
